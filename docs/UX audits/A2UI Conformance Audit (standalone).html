urface-1<\u002Ftd><td class=\"ratio\">≈ 17.4:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"pass\">pass<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#d0d6e0\"><\u002Fspan>--ink-muted<\u002Ftd><td>--surface-1<\u002Ftd><td class=\"ratio\">≈ 12.1:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"pass\">pass<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#8a8f98\"><\u002Fspan>--ink-subtle<\u002Ftd><td>--surface-1<\u002Ftd><td class=\"ratio\">≈ 5.6:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"pass\">pass<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#8a8f98\"><\u002Fspan>--ink-subtle<\u002Ftd><td>--surface-3<\u002Ftd><td class=\"ratio\">≈ 5.1:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"pass\">pass<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#5b5f66\"><\u002Fspan>--ink-faint<\u002Ftd><td>--surface-1<\u002Ftd><td class=\"ratio\">≈ 2.9:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"fail\">fail — disabled/dividers only<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#ff6b35\"><\u002Fspan>--ember<\u002Ftd><td>--surface-1<\u002Ftd><td class=\"ratio\">≈ 6.7:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"pass\">pass<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#1a0d07\"><\u002Fspan>--ember-ink<\u002Ftd><td>--ember (CTA fill)<\u002Ftd><td class=\"ratio\">≈ 6.6:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"pass\">pass<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#5e6ad2\"><\u002Fspan>--agent<\u002Ftd><td>--surface-1<\u002Ftd><td class=\"ratio\">≈ 3.8:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"fail\">fail for &lt;18px text<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#7c87e8\"><\u002Fspan>--agent-hot<\u002Ftd><td>--surface-1<\u002Ftd><td class=\"ratio\">≈ 5.3:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"pass\">pass — use for agent text<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#27a644\"><\u002Fspan>--success<\u002Ftd><td>--surface-1<\u002Ftd><td class=\"ratio\">≈ 6.0:1<\u002Ftd><td>≥4.5<\u002Ftd><td class=\"pass\">pass<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n        <ul class=\"clean\">\n          <li><b>Fix — agent text:<\u002Fb> the presence label (\"Jarvis is thinking…\", 13px) and the\n            <code class=\"inline\">CoachNote<\u002Fcode> \"Hint\" title (11px) are painted <code class=\"inline\">--agent<\u002Fcode>\n            at <b>3.8:1 — fails AA for small text<\u002Fb>. Repaint agent <em>text<\u002Fem> with\n            <code class=\"inline\">--agent-hot<\u002Fcode> (5.3:1); keep raw <code class=\"inline\">--agent<\u002Fcode> only on\n            the 3px rail and the shimmer (non-text). Same applies to the CoachNote hint title.<\u002Fli>\n          <li class=\"ok\"><b>--ink-faint is sound<\u002Fb> as long as it never carries essential text — it's bound to\n            disabled buttons and dividers only. Confirmed in the mockup; keep that discipline.<\u002Fli>\n        <\u002Ful>\n\n        <h3 class=\"sub\">No meaning is color- or motion-only<\u002Fh3>\n        <ul class=\"clean\">\n          <li><b>Fix — quiz correct/wrong:<\u002Fb> the mockup signals correctness with <span class=\"pass\">green<\u002Fspan>/<span class=\"fail\">red<\u002Fspan>\n            tint <em>only<\u002Fem> — color-only meaning. Add a non-color cue: a <code class=\"inline\">check<\u002Fcode> icon\n            on the correct choice and an <code class=\"inline\">x<\u002Fcode> on the wrong one (the revised QuizCard does this).<\u002Fli>\n          <li><b>Fix — PromptDiff:<\u002Fb> deletions carry a <code class=\"inline\">line-through<\u002Fcode> (non-color cue ✓)\n            but additions are color-only. Add a leading <code class=\"inline\">+<\u002Fcode> / underline to inserted spans.<\u002Fli>\n          <li class=\"ok\"><b>SkillMap mastery<\u002Fb> is encoded by node <em>radius<\u002Fem> as well as color — size is the\n            redundant non-color cue, so removing agent-sent x/y (V6) doesn't cost accessibility.<\u002Fli>\n          <li class=\"ok\"><b>Presence state<\u002Fb> is dot color + animation <em>and<\u002Fem> a text label\n            (\"ready / thinking… / forging…\"). Not motion-only.<\u002Fli>\n          <li class=\"ok\"><b>The Weld's \"Jarvis made this\" signal<\u002Fb> is also carried by the\n            <code class=\"inline\">CoachNote<\u002Fcode> text and presence label — never motion-alone.<\u002Fli>\n        <\u002Ful>\n\n        <h3 class=\"sub\">Reduced-motion fallbacks<\u002Fh3>\n        <ul class=\"clean\">\n          <li class=\"ok\"><b>Weld:<\u002Fb> under <code class=\"inline\">prefers-reduced-motion: reduce<\u002Fcode> the\n            ember-hot cool + 8px rise become a <b>150ms opacity fade<\u002Fb>; content is always\n            <code class=\"inline\">opacity:1<\u002Fcode> at base, so a frozen or printed frame shows the surface, never a blank.<\u002Fli>\n          <li><b>Tighten:<\u002Fb> the current reduced-motion weld drops the ember entirely, which loses the\n            \"warm = agent just made this\" chroma. Keep a <b>static warm hairline<\u002Fb> that persists ~600ms (no animation) so the\n            chromatic signal survives without motion.<\u002Fli>\n          <li class=\"ok\"><b>Shimmer:<\u002Fb> collapses to a <b>static <code class=\"inline\">--agent<\u002Fcode> top border<\u002Fb> —\n            presence is still legible, nothing sweeps.<\u002Fli>\n          <li class=\"ok\"><b>Live ticks:<\u002Fb> ring/meter springs are disabled; values jump to final. The bound number\n            still updates, so the feedback (the change) is preserved without animation.<\u002Fli>\n        <\u002Ful>\n\n        <h3 class=\"sub\">Theming stays within the 3 allowed tokens<\u002Fh3>\n        <ul class=\"clean\">\n          <li class=\"ok\"><b>primaryColor<\u002Fb> → drives <code class=\"inline\">--ember<\u002Fcode> (and every \"primary\" Button / active Step / weld glow derived from it).<\u002Fli>\n          <li class=\"ok\"><b>agentDisplayName<\u002Fb> → \"Jarvis\" in the presence label and CoachNote attribution; no hardcoded name should remain in components.<\u002Fli>\n          <li class=\"ok\"><b>iconUrl<\u002Fb> → the brand mark in the app shell.<\u002Fli>\n          <li><b>Fix — no agent CSS:<\u002Fb> after V9, every other color resolves from <code class=\"inline\">--ink* / --surface* / --hairline / --agent / --success<\u002Fcode>, all renderer-owned. The agent message contains <b>none<\u002Fb> of these — it sends only the 3 theme tokens plus component data. Grain, glass, bloom, weld, shimmer, weights and radii are all renderer styling keyed off state, exactly as the constraint requires.<\u002Fli>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <!-- ================= REVISED ================= -->\n      <section id=\"revised\">\n        <div class=\"sec-eyebrow\"><span class=\"num\">06<\u002Fspan> Revised mockup<\u002Fdiv>\n        <h2 class=\"sec\">Only the violating parts, regenerated<\u002Fh2>\n        <p class=\"sec-intro\">Everything that passed is kept verbatim. The revised kit lives at\n          <a class=\"deck-link\" href=\"ui_kits/skillforge-learn-v2/index.html\">ui_kits/skillforge-learn-v2/<\u002Fa>\n          — same five moments, now protocol-shaped: a real data model with <code class=\"inline\">updateDataModel<\u002Fcode>\n          patches, server-graded quiz, <code class=\"inline\">Row<\u002Fcode>/<code class=\"inline\">Column<\u002Fcode> layout,\n          de-embered meters, bound <code class=\"inline\">Reveal.open<\u002Fcode>, topology-only SkillMap, child-based Buttons,\n          and token-derived tints. Representative before/after:<\u002Fp>\n\n        <h3 class=\"sub\">Button — drop the invented props (V4)<\u002Fh3>\n        <div class=\"ba\">\n          <div class=\"col before\"><h4>Before — invented icon + text-as-prop<\u002Fh4>\n<pre>&lt;Button variant=<span style=\"color:#9ed8b1\">\"primary\"<\u002Fspan> icon=<span style=\"color:#9ed8b1\">\"flame\"<\u002Fspan>\n        onClick={runDiagnostic}&gt;\n  Run a quick diagnostic\n&lt;/Button&gt;<\u002Fpre><\u002Fdiv>\n          <div class=\"col after\"><h4>After — single child = Row[Icon, Text]<\u002Fh4>\n<pre>&lt;Button emphasis=<span style=\"color:#9ed8b1\">\"primary\"<\u002Fspan> action={evt(<span style=\"color:#9ed8b1\">\"runDiagnostic\"<\u002Fspan>)}&gt;\n  &lt;Row gap={8} align=<span style=\"color:#9ed8b1\">\"center\"<\u002Fspan>&gt;\n    &lt;Icon name=<span style=\"color:#9ed8b1\">\"flame\"<\u002Fspan> /&gt;\n    &lt;Text&gt;Run a quick diagnostic&lt;/Text&gt;\n  &lt;/Row&gt;\n&lt;/Button&gt;<\u002Fpre><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 class=\"sub\">Live value — bind, don't hardcode (V2)<\u002Fh3>\n        <div class=\"ba\">\n          <div class=\"col before\"><h4>Before — literal in client state<\u002Fh4>\n<pre>&lt;ProgressRing value={score / 5}\n              tone=<span style=\"color:#9ed8b1\">\"ember\"<\u002Fspan> size={96} /&gt;<\u002Fpre><\u002Fdiv>\n          <div class=\"col after\"><h4>After — bound pointer, neutral tone (V3/V10)<\u002Fh4>\n<pre>&lt;ProgressRing\n   value={bind(<span style=\"color:#9ed8b1\">\"/results/scorePct\"<\u002Fspan>)}\n   label={bind(<span style=\"color:#9ed8b1\">\"/results/scoreLabel\"<\u002Fspan>)}\n   tone=<span style=\"color:#9ed8b1\">\"success\"<\u002Fspan> /&gt;  <span style=\"color:#5b5f66\">{/* renderer sizes it */}<\u002Fspan><\u002Fpre><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 class=\"sub\">Quiz — grade on the server (V1)<\u002Fh3>\n        <div class=\"ba\">\n          <div class=\"col before\"><h4>Before — client grades + timer advances<\u002Fh4>\n<pre>const pick = (k) =&gt; {\n  setSelected(k);\n  setTimeout(() =&gt;\n    onAnswer(k, k === correctKey), 850); <span style=\"color:#5b5f66\">// ⛔<\u002Fspan>\n};<\u002Fpre><\u002Fdiv>\n          <div class=\"col after\"><h4>After — fire event, agent decides<\u002Fh4>\n<pre>const pick = (k) =&gt; {\n  setSelected(k);            <span style=\"color:#5b5f66\">// local only<\u002Fspan>\n  emit({ event: { name: <span style=\"color:#9ed8b1\">\"answerSelected\"<\u002Fspan>,\n                  args: { choice: k } } });\n}; <span style=\"color:#5b5f66\">// correctness + next Q arrive as messages<\u002Fspan><\u002Fpre><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"callout\"><b>What stayed:<\u002Fb> the Weld choreography, the streaming shimmer, the Jarvis presence\n          model, the CoachNote voice, the Reveal/CodeBlock/Stepper internals, the single-column surface canvas, and\n          the overall five-moment scenario — all passed and are untouched. The audit changed the <em>wiring<\u002Fem>,\n          not the <em>feeling<\u002Fem>.<p><\u002Fp><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <footer>\n    The Forge · SkillForge design system — A2UI v0.9 conformance audit · built to spec, reconcile against\n    learn-catalog.json + authorizeMutation.js when the codebase is attached · 11 violations · 9 (a) · 3 (c) · 1 (b)\n  <\u002Ffooter>\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
