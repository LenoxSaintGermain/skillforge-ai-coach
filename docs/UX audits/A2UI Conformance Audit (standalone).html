document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"c5ac10e2-c30e-4afa-993d-06d77695acd4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8bf8553e-4da4-4834-967a-37a321a2d1e0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"c87e7f88-27da-4311-9410-b5bac4650951\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- CANVAS & SURFACES — Linear discipline -------------------------- */\n  --canvas:        #050507;   /* deepest — the void the forge lights up */\n  --surface-1:     #0f1011;   /* lesson panels */\n  --surface-2:     #141516;   /* raised / hover */\n  --surface-3:     #1b1d1f;   /* popovers, inputs, pressed */\n  --hairline:      #23252a;   /* 1px borders — NEVER shadows-as-borders */\n  --hairline-warm: #2a2320;   /* hairline on freshly-forged surfaces (cools ~1.2s) */\n\n  /* ---- INK ------------------------------------------------------------ */\n  --ink:           #f7f8f8;   /* primary text */\n  --ink-muted:     #d0d6e0;   /* secondary text */\n  --ink-subtle:    #8a8f98;   /* captions, metadata, placeholders */\n  --ink-faint:     #5b5f66;   /* disabled, dividers-on-ink */\n\n  /* ---- THE ACCENT — forge ember --------------------------------------- */\n  /* Reserved for: the weld, the active step, the primary CTA. Never decorative. */\n  --ember:         #ff6b35;\n  --ember-hot:     #ff8a5c;   /* the instant a surface is forged */\n  --ember-glow:    #ff6b3533; /* focus ring / weld bloom (20% alpha) */\n  --ember-ink:     #1a0d07;   /* text/icon ON an ember fill */\n\n  /* ---- AGENT PRESENCE — cool \"Jarvis is working\" signal --------------- */\n  --agent:         #5e6ad2;   /* Linear lavender — live/streaming state */\n  --agent-hot:     #7c87e8;\n  --agent-glow:    #5e6ad233;\n\n  /* ---- SEMANTIC ------------------------------------------------------- */\n  --success:       #27a644;\n  --success-glow:  #27a64433;\n  --warn:          #e5a13a;\n  --warn-glow:     #e5a13a33;\n  --danger:        #e5484d;\n  --danger-glow:   #e5484d33;\n\n  /* ---- TONE MAP (component \"tone\" prop ⇒ color) ----------------------- */\n  --tone-ember:    var(--ember);\n  --tone-agent:    var(--agent);\n  --tone-success:  var(--success);\n  --tone-hint:     var(--agent);\n  --tone-nudge:    var(--ember);\n  --tone-praise:   var(--success);\n  --tone-warn:     var(--warn);\n\n  /* ---- TYPE FAMILIES -------------------------------------------------- */\n  --font-display: \"General Sans\", \"Söhne\", ui-sans-serif, system-ui, sans-serif;\n  --font-body:    \"Switzer\", \"Söhne\", ui-sans-serif, system-ui, sans-serif;\n  --font-mono:    \"JetBrains Mono\", \"Berkeley Mono\", ui-monospace, \"SF Mono\", monospace;\n\n  /* ---- TYPE SCALE (px) ------------------------------------------------ */\n  --fs-display-xl: 64px;\n  --fs-display:    44px;\n  --fs-headline:   28px;\n  --fs-card-title: 22px;\n  --fs-subhead:    20px;\n  --fs-body:       16px;\n  --fs-body-lg:    18px;\n  --fs-caption:    13px;\n  --fs-micro:      11px;\n\n  /* ---- WEIGHTS / TRACKING / LEADING ----------------------------------- */\n  --fw-regular: 400;\n  --fw-medium:  500;\n  --fw-semi:    600;\n  --fw-bold:    700;\n\n  --track-display: -0.02em;   /* negative tracking at display sizes */\n  --track-tight:   -0.01em;\n  --track-normal:   0;\n  --track-caps:     0.06em;   /* the only place we letter-space out */\n\n  --lh-tight:  1.1;\n  --lh-snug:   1.25;\n  --lh-body:   1.5;\n\n  /* ---- SPACING (4px base) --------------------------------------------- */\n  --sp-1: 4px;\n  --sp-2: 8px;\n  --sp-3: 12px;\n  --sp-4: 16px;\n  --sp-5: 20px;\n  --sp-6: 24px;\n  --sp-8: 32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n\n  /* ---- RADII ---------------------------------------------------------- */\n  --r-xs:   4px;    /* chips, tags, inline code */\n  --r-sm:   8px;    /* buttons, inputs */\n  --r-md:   12px;   /* cards, coach notes */\n  --r-lg:   16px;   /* panels, modals */\n  --r-xl:   24px;   /* the surface shell */\n  --r-pill: 999px;  /* progress fills, presence dot, choice pills */\n\n  /* ---- ELEVATION — color steps, not drop shadows ---------------------\n     Depth comes from --surface-1/2/3. The only \"shadows\" are warm glows\n     used by the Weld + focus, never neutral grey drop-shadows. ---------- */\n  --glow-ember:  0 0 0 1px var(--ember), 0 0 24px -2px var(--ember-glow);\n  --glow-agent:  0 0 0 1px var(--agent), 0 0 24px -2px var(--agent-glow);\n  --glow-focus:  0 0 0 3px var(--ember-glow);\n  --lift:        0 1px 0 0 rgba(255,255,255,0.03) inset, 0 12px 32px -12px rgba(0,0,0,0.6);\n\n  /* ---- MOTION --------------------------------------------------------- */\n  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);   /* the house ease */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);/* live data ticks */\n  --dur-fast:    150ms;\n  --dur-base:    260ms;\n  --dur-weld:    1200ms;  /* ember cools to neutral */\n}\n\n/* ============================================================================\n   SEMANTIC ELEMENT STYLES — apply via class or @extend in components\n   ========================================================================== */\n\n.t-display-xl,\nh1.t {\n  font-family: var(--font-display);\n  font-size: var(--fs-display-xl);\n  font-weight: var(--fw-semi);\n  letter-spacing: var(--track-display);\n  line-height: var(--lh-tight);\n  color: var(--ink);\n}\n\n.t-display { font-family: var(--font-display); font-size: var(--fs-display); font-weight: var(--fw-semi); letter-spacing: var(--track-display); line-height: var(--lh-tight); color: var(--ink); }\n\n.t-headline,\nh2.t {\n  font-family: var(--font-display);\n  font-size: var(--fs-headline);\n  font-weight: var(--fw-semi);\n  letter-spacing: var(--track-tight);\n  line-height: var(--lh-snug);\n  color: var(--ink);\n}\n\n.t-card-title,\nh3.t {\n  font-family: var(--font-display);\n  font-size: var(--fs-card-title);\n  font-weight: var(--fw-medium);\n  letter-spacing: var(--track-tight);\n  line-height: var(--lh-snug);\n  color: var(--ink);\n}\n\n.t-subhead { font-family: var(--font-display); font-size: var(--fs-subhead); font-weight: var(--fw-medium); letter-spacing: var(--track-tight); line-height: var(--lh-snug); color: var(--ink); }\n\n.t-body,\np.t {\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  font-weight: var(--fw-regular);\n  line-height: var(--lh-body);\n  color: var(--ink-muted);\n}\n\n.t-body-lg { font-family: var(--font-body); font-size: var(--fs-body-lg); font-weight: var(--fw-regular); line-height: var(--lh-body); color: var(--ink-muted); }\n\n.t-caption {\n  font-family: var(--font-body);\n  font-size: var(--fs-caption);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-snug);\n  color: var(--ink-subtle);\n}\n\n.t-eyebrow {\n  font-family: var(--font-body);\n  font-size: var(--fs-caption);\n  font-weight: var(--fw-semi);\n  letter-spacing: var(--track-caps);\n  text-transform: uppercase;\n  color: var(--ink-subtle);\n}\n\n.t-mono,\ncode.t {\n  font-family: var(--font-mono);\n  font-size: 14px;\n  font-weight: var(--fw-regular);\n  letter-spacing: 0;\n  color: var(--ink-muted);\n}\n\n/* Helpers ----------------------------------------------------------------- */\n.ink        { color: var(--ink); }\n.ink-muted  { color: var(--ink-muted); }\n.ink-subtle { color: var(--ink-subtle); }\n.ember      { color: var(--ember); }\n.agent      { color: var(--agent); }\n<\u002Fstyle>\n<style>\n  /* Inlined General Sans @font-face (display face) so the bundler captures the woff2\n     directly from cdn.fontshare.com — the api.fontshare.com @import endpoint isn't fetchable. */\n  @font-face { font-family: 'General Sans'; font-weight: 400; font-display: swap; font-style: normal;\n    src: url(\"4591f71a-bbca-4225-bd39-d6569b2348d2\") format('woff2'); }\n  @font-face { font-family: 'General Sans'; font-weight: 500; font-display: swap; font-style: normal;\n    src: url(\"8747b0d8-4dd6-4423-8ea6-1d896bf95eef\") format('woff2'); }\n  @font-face { font-family: 'General Sans'; font-weight: 600; font-display: swap; font-style: normal;\n    src: url(\"30bb24c1-ebd8-4ffa-a581-3f327574ab9a\") format('woff2'); }\n  @font-face { font-family: 'General Sans'; font-weight: 700; font-display: swap; font-style: normal;\n    src: url(\"2847b2fe-a290-4b06-a8ce-03eae93288f4\") format('woff2'); }\n<\u002Fstyle>\n\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; }\n  body {\n    background: var(--canvas);\n    color: var(--ink-muted);\n    font-family: var(--font-body);\n    -webkit-font-smoothing: antialiased;\n    line-height: var(--lh-body);\n  }\n  /* faint grain so the void isn't flat-black */\n  body::before {\n    content: \"\"; position: fixed; inset: 0; z-index: 0; pointer-events: none;\n    background-image: url(\"e25c42c8-c4ed-4fe3-a3e8-bb1e3689eb2f\"); background-size: 220px;\n    opacity: 0.022; mix-blend-mode: screen;\n  }\n\n  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 32px; }\n  .layout { display: grid; grid-template-columns: 224px 1fr; gap: 56px; align-items: start; }\n\n  /* ---- masthead ---- */\n  header.masthead { padding: 64px 0 40px; border-bottom: 1px solid var(--hairline); }\n  .kicker { font-family: var(--font-body); font-size: 11px; font-weight: 600;\n    letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--ink-subtle); }\n  .kicker .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;\n    background: var(--ember); transform: rotate(45deg); border-radius: 2px; margin-right: 9px;\n    vertical-align: middle; box-shadow: 0 0 12px -1px var(--ember-glow); }\n  h1.title { font-family: var(--font-display); font-weight: 600; font-size: clamp(34px, 5vw, 56px);\n    letter-spacing: var(--track-display); line-height: 1.04; color: var(--ink); margin: 18px 0 0;\n    max-width: 18ch; }\n  .standfirst { font-size: 18px; line-height: 1.55; color: var(--ink-muted); max-width: 62ch; margin: 20px 0 0; }\n  .standfirst b { color: var(--ink); font-weight: 600; }\n  .meta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }\n  .meta-pill { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.02em;\n    color: var(--ink-subtle); border: 1px solid var(--hairline); border-radius: var(--r-pill);\n    padding: 6px 13px; background: var(--surface-1); }\n  .meta-pill b { color: var(--ink-muted); font-weight: 500; }\n\n  /* ---- side nav ---- */\n  nav.toc { position: sticky; top: 28px; padding-top: 48px; }\n  nav.toc ol { list-style: none; margin: 0; padding: 0; counter-reset: toc; }\n  nav.toc a { display: block; text-decoration: none; color: var(--ink-subtle); font-size: 13.5px;\n    line-height: 1.35; padding: 8px 0 8px 30px; position: relative; border-left: 1px solid var(--hairline);\n    transition: color .15s var(--ease-out), border-color .15s var(--ease-out); }\n  nav.toc a::before { counter-increment: toc; content: counter(toc, decimal-leading-zero);\n    position: absolute; left: 0; top: 8px; font-family: var(--font-mono); font-size: 10px;\n    color: var(--ink-faint); }\n  nav.toc a:hover { color: var(--ink); border-left-color: var(--ink-subtle); }\n  nav.toc a.lede { color: var(--ink-muted); }\n\n  /* ---- body sections ---- */\n  main { padding: 48px 0 120px; min-width: 0; }\n  section { padding: 40px 0; border-top: 1px solid var(--hairline); scroll-margin-top: 24px; }\n  section:first-child { border-top: none; padding-top: 8px; }\n  .sec-eyebrow { font-family: var(--font-body); font-size: 11px; font-weight: 600;\n    letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--ember);\n    display: flex; align-items: center; gap: 10px; }\n  .sec-eyebrow .num { font-family: var(--font-mono); color: var(--ink-faint); }\n  h2.sec { font-family: var(--font-display); font-weight: 600; font-size: 30px;\n    letter-spacing: var(--track-tight); line-height: 1.15; color: var(--ink); margin: 14px 0 0; max-width: 24ch; }\n  .sec-intro { font-size: 16.5px; color: var(--ink-muted); margin: 16px 0 28px; max-width: 70ch; }\n  .sec-intro b { color: var(--ink); font-weight: 600; }\n  h3.sub { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--ink);\n    letter-spacing: var(--track-tight); margin: 36px 0 14px; }\n  p { max-width: 72ch; }\n  p strong, li strong { color: var(--ink); font-weight: 600; }\n  code.inline { font-family: var(--font-mono); font-size: 0.86em; background: var(--surface-3);\n    color: var(--ink); padding: 1.5px 6px; border-radius: var(--r-xs); }\n  .ember-ink { color: var(--ember); }\n  .agent-ink { color: var(--agent-hot); }\n\n  /* ---- ledger table ---- */\n  .ledger-scroll { border: 1px solid var(--hairline); border-radius: var(--r-lg); overflow: hidden;\n    background: var(--surface-1); }\n  table.ledger { width: 100%; border-collapse: collapse; font-size: 13.5px; }\n  table.ledger thead th { text-align: left; font-family: var(--font-body); font-weight: 600;\n    font-size: 10.5px; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--ink-subtle);\n    padding: 14px 16px; background: var(--surface-2); border-bottom: 1px solid var(--hairline); white-space: nowrap; }\n  table.ledger td { padding: 13px 16px; border-bottom: 1px solid var(--hairline); vertical-align: top;\n    color: var(--ink-muted); line-height: 1.5; }\n  table.ledger tr:last-child td { border-bottom: none; }\n  table.ledger tbody tr:hover { background: var(--surface-2); }\n  table.ledger .el { color: var(--ink); font-weight: 500; }\n  .cmp { font-family: var(--font-mono); font-size: 12px; color: var(--ink); }\n  .prop { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-subtle); }\n  .prop b { color: var(--ink-muted); font-weight: 400; }\n  .grp-row td { background: color-mix(in srgb, var(--surface-1), var(--ember) 5%);\n    font-family: var(--font-body); font-size: 10.5px; letter-spacing: var(--track-caps);\n    text-transform: uppercase; color: var(--ember); font-weight: 600; padding: 9px 16px; }\n\n  /* action shape chips */\n  .tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono);\n    font-size: 10.5px; padding: 2.5px 8px; border-radius: var(--r-pill); white-space: nowrap;\n    border: 1px solid var(--hairline); }\n  .tag.event { color: var(--agent-hot); border-color: color-mix(in srgb, var(--agent) 50%, var(--hairline)); }\n  .tag.fn { color: var(--ink-muted); }\n  .tag.none { color: var(--ink-faint); }\n  .tag.bind { color: var(--ink-subtle); }\n\n  /* ---- violation cards ---- */\n  .viol { border: 1px solid var(--hairline); border-radius: var(--r-lg); background: var(--surface-1);\n    margin: 18px 0; overflow: hidden; }\n  .viol-head { display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px 14px;\n    border-bottom: 1px solid var(--hairline); }\n  .viol-num { font-family: var(--font-mono); font-size: 12px; color: var(--ember-ink);\n    background: var(--ember); width: 26px; height: 26px; border-radius: 7px; display: grid;\n    place-items: center; flex: none; font-weight: 600; }\n  .viol-num.ok { background: var(--success); color: #04140a; }\n  .viol-title { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--ink);\n    letter-spacing: var(--track-tight); margin: 0; line-height: 1.3; }\n  .viol-grid { display: grid; grid-template-columns: 92px 1fr; }\n  .viol-grid > dt { font-family: var(--font-body); font-size: 10.5px; font-weight: 600;\n    letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--ink-subtle);\n    padding: 13px 20px; border-bottom: 1px solid var(--hairline); }\n  .viol-grid > dd { margin: 0; padding: 13px 20px 13px 0; border-bottom: 1px solid var(--hairline);\n    font-size: 14px; color: var(--ink-muted); line-height: 1.5; }\n  .viol-grid > dd:last-of-type, .viol-grid > dt:last-of-type { border-bottom: none; }\n  .fix-label { display: inline-block; font-family: var(--font-mono); font-size: 10.5px;\n    padding: 2px 8px; border-radius: var(--r-xs); margin-right: 8px; vertical-align: 1px; }\n  .fix-a { background: color-mix(in srgb, var(--surface-3), var(--success) 14%); color: #7ee0a0; }\n  .fix-b { background: color-mix(in srgb, var(--surface-3), var(--warn) 16%); color: var(--warn); }\n  .fix-c { background: color-mix(in srgb, var(--surface-3), var(--agent) 16%); color: var(--agent-hot); }\n\n  /* ---- code / message blocks ---- */\n  .code { background: #0a0b0c; border: 1px solid var(--hairline); border-radius: var(--r-md);\n    overflow: hidden; margin: 16px 0; }\n  .code-bar { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px;\n    border-bottom: 1px solid var(--hairline); }\n  .code-bar .lang { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em;\n    text-transform: uppercase; color: var(--ink-subtle); }\n  .code-bar .seq { font-family: var(--font-mono); font-size: 10.5px; color: var(--ember); }\n  pre { margin: 0; padding: 16px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.65;\n    color: var(--ink-muted); overflow-x: auto; white-space: pre; }\n  pre .k { color: var(--agent-hot); }      /* message type / keys of note */\n  pre .s { color: #9ed8b1; }                /* string */\n  pre .b { color: var(--ember); }           /* bind / pointer */\n  pre .c { color: var(--ink-faint); font-style: italic; }  /* comment */\n  pre .n { color: #d9b178; }                /* number */\n\n  .step-flow { counter-reset: flow; list-style: none; padding: 0; margin: 18px 0; }\n  .step-flow > li { position: relative; padding: 0 0 22px 42px; }\n  .step-flow > li::before { counter-increment: flow; content: counter(flow);\n    position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%;\n    border: 1px solid var(--hairline); background: var(--surface-1); color: var(--ink-subtle);\n    font-family: var(--font-mono); font-size: 12px; display: grid; place-items: center; }\n  .step-flow > li::after { content: \"\"; position: absolute; left: 13px; top: 30px; bottom: 2px;\n    width: 1px; background: var(--hairline); }\n  .step-flow > li:last-child::after { display: none; }\n  .step-flow > li.weld::before { border-color: var(--ember); color: var(--ember);\n    box-shadow: 0 0 0 3px var(--ember-glow); }\n  .step-flow > li.stream::before { border-color: var(--agent); color: var(--agent-hot); }\n  .step-flow .flow-t { font-family: var(--font-display); font-weight: 600; color: var(--ink);\n    font-size: 15px; margin: 2px 0 4px; }\n  .step-flow .flow-d { font-size: 14px; color: var(--ink-muted); max-width: 66ch; }\n  .step-flow .flow-d .owner { font-family: var(--font-mono); font-size: 11px; color: var(--ink-subtle); }\n\n  /* ---- a11y table ---- */\n  table.a11y { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 4px;\n    border: 1px solid var(--hairline); border-radius: var(--r-md); overflow: hidden; }\n  table.a11y th { text-align: left; font-size: 10px; letter-spacing: var(--track-caps);\n    text-transform: uppercase; color: var(--ink-subtle); font-weight: 600; padding: 11px 14px;\n    background: var(--surface-2); border-bottom: 1px solid var(--hairline); }\n  table.a11y td { padding: 11px 14px; border-bottom: 1px solid var(--hairline); color: var(--ink-muted);\n    font-family: var(--font-mono); font-size: 12px; }\n  table.a11y tr:last-child td { border-bottom: none; }\n  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px;\n    margin-right: 7px; border: 1px solid var(--hairline); }\n  .pass { color: var(--success); }\n  .fail { color: var(--danger); }\n  .warnc { color: var(--warn); }\n  .ratio { color: var(--ink); }\n\n  ul.clean { list-style: none; padding: 0; margin: 14px 0; }\n  ul.clean > li { position: relative; padding: 7px 0 7px 26px; font-size: 14.5px; color: var(--ink-muted);\n    line-height: 1.5; border-bottom: 1px solid var(--hairline); max-width: 74ch; }\n  ul.clean > li:last-child { border-bottom: none; }\n  ul.clean > li::before { content: \"\"; position: absolute; left: 4px; top: 15px; width: 6px; height: 6px;\n    border-radius: 1px; transform: rotate(45deg); background: var(--ember); }\n  ul.clean > li.ok::before { background: var(--success); }\n\n  .callout { border: 1px solid var(--hairline); border-left: 2px solid var(--ember);\n    background: color-mix(in srgb, var(--surface-1), var(--ember) 3%); border-radius: 0 var(--r-md) var(--r-md) 0;\n    padding: 16px 20px; margin: 22px 0; font-size: 14.5px; color: var(--ink-muted); max-width: 74ch; }\n  .callout b { color: var(--ink); }\n  .callout.agent { border-left-color: var(--agent); }\n\n  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }\n  .ba .col { border: 1px solid var(--hairline); border-radius: var(--r-md); overflow: hidden; background: var(--surface-1); }\n  .ba .col h4 { margin: 0; font-family: var(--font-body); font-size: 10.5px; letter-spacing: var(--track-caps);\n    text-transform: uppercase; padding: 10px 14px; border-bottom: 1px solid var(--hairline); }\n  .ba .before h4 { color: var(--danger); }\n  .ba .after h4 { color: var(--success); }\n  .ba pre { font-size: 11.5px; padding: 13px 14px; background: transparent; }\n\n  a.deck-link { color: var(--ember); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--ember) 40%, transparent); }\n  a.deck-link:hover { border-bottom-color: var(--ember); }\n\n  footer { border-top: 1px solid var(--hairline); padding: 30px 0 80px; color: var(--ink-faint);\n    font-size: 12.5px; font-family: var(--font-mono); }\n\n  @media (max-width: 940px) {\n    .layout { grid-template-columns: 1fr; gap: 0; }\n    nav.toc { display: none; }\n    .ba { grid-template-columns: 1fr; }\n    .viol-grid { grid-template-columns: 1fr; }\n    .viol-grid > dt { border-bottom: none; padding-bottom: 0; }\n    .viol-grid > dd { padding-left: 20px; }\n  }\n  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }\n  html { scroll-behavior: smooth; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"wrap\">\n  <header class=\"masthead\">\n    <div class=\"kicker\"><span class=\"dot\"><\u002Fspan>The Living Forge · self-adversarial review · A2UI v0.9<\u002Fdiv>\n    <h1 class=\"title\">Conformance audit of my own mockup<\u002Fh1>\n    <p class=\"standfirst\">Beauty is assumed. This document tests <b>fidelity<\u002Fb> — whether the\n      Living Forge learner surface can actually be expressed in the locked <code class=\"inline\">learn<\u002Fcode>\n      catalog (15 basic + 11 learn components), with only the two legal action shapes, only data-bound\n      live values, and zero agent-emitted CSS. I am being adversarial with myself: every element is\n      forced onto a catalog component, every shortcut is named as a violation, and nothing is loosened\n      to make the design easier.<\u002Fp>\n    <div class=\"meta-row\">\n      <span class=\"meta-pill\"><b>Subject:<\u002Fb> ui_kits/skillforge-learn/<\u002Fspan>\n      <span class=\"meta-pill\"><b>Catalog:<\u002Fb> 15 basic + 11 learn (locked, D3)<\u002Fspan>\n      <span class=\"meta-pill\"><b>Verdict:<\u002Fb> 11 violations · 9 fix-in-place · 3 round-trip · 1 extension proposed<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"layout\">\n    <nav class=\"toc\" aria-label=\"Sections\">\n      <ol>\n        <li><a class=\"lede\" href=\"#tldr\">Verdict in one breath<\u002Fa><\u002Fli>\n        <li><a href=\"#ledger\">Component-mapping ledger<\u002Fa><\u002Fli>\n        <li><a href=\"#violations\">Violations found<\u002Fa><\u002Fli>\n        <li><a href=\"#weld\">The Weld &amp; streaming, in protocol<\u002Fa><\u002Fli>\n        <li><a href=\"#loop\">The diagnostic loop (§6.2)<\u002Fa><\u002Fli>\n        <li><a href=\"#a11y\">A11y &amp; theming pass<\u002Fa><\u002Fli>\n        <li><a href=\"#revised\">Revised mockup<\u002Fa><\u002Fli>\n      <\u002Fol>\n    <\u002Fnav>\n\n    <main>\n      <!-- ================= TL;DR ================= -->\n      <section id=\"tldr\">\n        <div class=\"sec-eyebrow\"><span class=\"num\">00<\u002Fspan> Verdict in one breath<\u002Fdiv>\n        <h2 class=\"sec\">The five moments survive the catalog. The plumbing under them did not.<\u002Fh2>\n        <p class=\"sec-intro\">The <b>shapes<\u002Fb> are legal — every screen maps to real components with no\n          Accordion, Table, Badge, or Chart in sight. What breaks is the <b>wiring<\u002Fb>: the mockup grades\n          quiz answers on the client, hardcodes \"live\" values as literals, paints progress rings\n          <span class=\"ember-ink\">ember<\u002Fspan> (a reserved color), invents an <code class=\"inline\">icon<\u002Fcode>\n          prop on <code class=\"inline\">Button<\u002Fcode>, lays out with styled <code class=\"inline\">&lt;div&gt;<\u002Fcode>s\n          instead of <code class=\"inline\">Row<\u002Fcode>/<code class=\"inline\">Column<\u002Fcode>, and ships raw hex\n          tints the agent is forbidden to emit. All but one are fixable without touching the locked 11.<\u002Fp>\n        <ul class=\"clean\">\n          <li class=\"ok\"><b>Passes:<\u002Fb> No illegal components. Collapsibles are <code class=\"inline\">Reveal<\u002Fcode>, not Accordion. Jarvis is in-surface (<code class=\"inline\">CoachNote<\u002Fcode> + breathing dot), not a corner bubble. Nudges are additive and never stacked. Inputs stay local until an action fires.<\u002Fli>\n          <li><b>Fails, fixable in-catalog (a):<\u002Fb> invented <code class=\"inline\">Button.icon<\u002Fcode>; <span class=\"ember-ink\">ember<\u002Fspan> as a decorative ring/meter color; <code class=\"inline\">ProgressRing.size<\u002Fcode>; <code class=\"inline\">Reveal.defaultOpen<\u002Fcode> instead of bound <code class=\"inline\">open<\u002Fcode>; <code class=\"inline\">SkillMap<\u002Fcode> nodes carrying <code class=\"inline\">x/y<\u002Fcode> layout; styled <code class=\"inline\">&lt;div&gt;<\u002Fcode> layout; raw hex on elements.<\u002Fli>\n          <li><b>Fails, must be a round-trip (c):<\u002Fb> client-side answer grading; client auto-advance timer; PromptDiff \"re-run\" generating an improved prompt locally.<\u002Fli>\n          <li><b>Genuinely beyond the catalog (b):<\u002Fb> exactly one — a bound, animated numeric <em>delta<\u002Fem> badge on <code class=\"inline\">SkillMeter<\u002Fcode>. Routed through a documented extension request, not smuggled in.<\u002Fli>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <!-- ================= LEDGER ================= -->\n      <section id=\"ledger\">\n        <div class=\"sec-eyebrow\"><span class=\"num\">01<\u002Fspan> Component-mapping ledger<\u002Fdiv>\n        <h2 class=\"sec\">Every visual element, forced onto a catalog component<\u002Fh2>\n        <p class=\"sec-intro\">Notation: <code class=\"inline\">{\"$bind\":\"/ptr\"}<\u002Fcode> = value data-bound to a\n          JSON-Pointer path in the surface data model (not a literal). Action chips:\n          <span class=\"tag event\">event → Jarvis<\u002Fspan> = server round-trip,\n          <span class=\"tag fn\">fn:name<\u002Fspan> = registered <code class=\"inline\">functionCall<\u002Fcode> (local),\n          <span class=\"tag none\">renderer<\u002Fspan> = renderer-owned, not in the A2UI message.<\u002Fp>\n\n        <div class=\"ledger-scroll\">\n          <table class=\"ledger\">\n            <thead>\n              <tr><th>Visual element<\u002Fth><th>Catalog component<\u002Fth><th>Properties used<\u002Fth><th>Action / binding<\u002Fth><\u002Ftr>\n            <\u002Fthead>\n            <tbody>\n              <tr class=\"grp-row\"><td colspan=\"4\">App shell &amp; atmosphere — renderer-owned, never in an A2UI message<\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Brand mark + \"SkillForge\"<\u002Ftd><td class=\"cmp\">— chrome<\u002Ftd><td class=\"prop\">theme <b>iconUrl<\u002Fb>, <b>agentDisplayName<\u002Fb><\u002Ftd><td><span class=\"tag none\">renderer<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Jarvis presence dot + label<\u002Ftd><td class=\"cmp\">— chrome<\u002Ftd><td class=\"prop\">keyed off surface <b>stream state<\u002Fb><\u002Ftd><td><span class=\"tag none\">renderer<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Ember bloom, grain, weld glow<\u002Ftd><td class=\"cmp\">— chrome<\u002Ftd><td class=\"prop\">keyed off <b>\"components landed\"<\u002Fb> state<\u002Ftd><td><span class=\"tag none\">renderer<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Thinking skeleton / shimmer<\u002Ftd><td class=\"cmp\">— chrome<\u002Ftd><td class=\"prop\">keyed off <b>streaming<\u002Fb> state<\u002Ftd><td><span class=\"tag none\">renderer<\u002Fspan><\u002Ftd><\u002Ftr>\n\n              <tr class=\"grp-row\"><td colspan=\"4\">Surface scaffolding<\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Surface block (the card shell)<\u002Ftd><td class=\"cmp\">Card › Column<\u002Ftd><td class=\"prop\">Card wraps <b>one<\u002Fb> child = Column<\u002Ftd><td><span class=\"tag bind\">structural<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Vertical / horizontal groups<\u002Ftd><td class=\"cmp\">Column, Row<\u002Ftd><td class=\"prop\"><b>gap<\u002Fb>, <b>align<\u002Fb>, <b>justify<\u002Fb>, <b>wrap<\u002Fb><\u002Ftd><td><span class=\"tag bind\">structural<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Hairline rule<\u002Ftd><td class=\"cmp\">Divider<\u002Ftd><td class=\"prop\">—<\u002Ftd><td><span class=\"tag none\">—<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Eyebrow (\"DIAGNOSTIC\")<\u002Ftd><td class=\"cmp\">Text<\u002Ftd><td class=\"prop\"><b>text<\u002Fb>, <b>style<\u002Fb>:\"eyebrow\"<\u002Ftd><td><span class=\"tag none\">—<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Heading<\u002Ftd><td class=\"cmp\">Text<\u002Ftd><td class=\"prop\"><b>text<\u002Fb>, <b>style<\u002Fb>:\"headline\"<\u002Ftd><td><span class=\"tag none\">—<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Body prose (bold/italic inline)<\u002Ftd><td class=\"cmp\">Markdown<\u002Ftd><td class=\"prop\"><b>text<\u002Fb> (md string)<\u002Ftd><td><span class=\"tag none\">—<\u002Fspan><\u002Ftd><\u002Ftr>\n\n              <tr class=\"grp-row\"><td colspan=\"4\">Buttons &amp; intent<\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Primary CTA \"Run a diagnostic\"<\u002Ftd><td class=\"cmp\">Button › Row[Icon,Text]<\u002Ftd><td class=\"prop\"><b>emphasis<\u002Fb>:\"primary\", child = Row<\u002Ftd><td><span class=\"tag event\">event: runDiagnostic<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Secondary \"How am I doing?\"<\u002Ftd><td class=\"cmp\">Button › Row[Icon,Text]<\u002Ftd><td class=\"prop\"><b>emphasis<\u002Fb>:\"secondary\"<\u002Ftd><td><span class=\"tag event\">event: showMap<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Glyph inside a button<\u002Ftd><td class=\"cmp\">Icon<\u002Ftd><td class=\"prop\"><b>name<\u002Fb><\u002Ftd><td><span class=\"tag none\">—<\u002Fspan><\u002Ftd><\u002Ftr>\n\n              <tr class=\"grp-row\"><td colspan=\"4\">Diagnostic — one living surface<\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Progress ring (question N of 5)<\u002Ftd><td class=\"cmp\">ProgressRing<\u002Ftd><td class=\"prop\"><b>value<\u002Fb> {\"$bind\":\"/diag/progress\"}, <b>label<\u002Fb> {\"$bind\":\"/diag/index\"}, <b>tone<\u002Fb>:\"neutral\"<\u002Ftd><td><span class=\"tag bind\">bound<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">\"3 correct so far\"<\u002Ftd><td class=\"cmp\">Text<\u002Ftd><td class=\"prop\"><b>text<\u002Fb> {\"$bind\":\"/diag/correctLabel\"}, <b>style<\u002Fb>:\"caption\"<\u002Ftd><td><span class=\"tag bind\">bound<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Question + choices<\u002Ftd><td class=\"cmp\">QuizCard<\u002Ftd><td class=\"prop\"><b>prompt<\u002Fb> $bind, <b>choices<\u002Fb> $bind, <b>state<\u002Fb> $bind<\u002Ftd><td><span class=\"tag event\">event: answerSelected<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Correct / wrong marker<\u002Ftd><td class=\"cmp\">QuizCard (Icon cue)<\u002Ftd><td class=\"prop\"><b>state<\u002Fb> {\"$bind\":\"/diag/choiceState\"} (+ check/x icon)<\u002Ftd><td><span class=\"tag bind\">bound<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Feedback aside<\u002Ftd><td class=\"cmp\">CoachNote › Markdown<\u002Ftd><td class=\"prop\"><b>tone<\u002Fb> $bind, child Markdown $bind<\u002Ftd><td><span class=\"tag bind\">bound<\u002Fspan><\u002Ftd><\u002Ftr>\n\n              <tr class=\"grp-row\"><td colspan=\"4\">Results<\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Score ring<\u002Ftd><td class=\"cmp\">ProgressRing<\u002Ftd><td class=\"prop\"><b>value<\u002Fb> $bind, <b>label<\u002Fb> $bind, <b>tone<\u002Fb>:\"success\"<\u002Ftd><td><span class=\"tag bind\">bound<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Per-skill mastery bars<\u002Ftd><td class=\"cmp\">SkillMeter<\u002Ftd><td class=\"prop\"><b>skill<\u002Fb>, <b>value<\u002Fb> $bind, <b>tone<\u002Fb>:\"neutral\"|\"success\"<\u002Ftd><td><span class=\"tag bind\">bound<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">\"+18\" improvement badge<\u002Ftd><td class=\"cmp\">SkillMeter <b>delta<\u002Fb> ⚠<\u002Ftd><td class=\"prop\"><b>delta<\u002Fb> $bind — <b>not in catalog<\u002Fb> (see V11 / fix-b)<\u002Ftd><td><span class=\"tag bind\">bound<\u002Fspan><\u002Ftd><\u002Ftr>\n\n              <tr class=\"grp-row\"><td colspan=\"4\">Skill map &amp; lessons<\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Skill constellation<\u002Ftd><td class=\"cmp\">SkillMap<\u002Ftd><td class=\"prop\"><b>nodes<\u002Fb> $bind, <b>edges<\u002Fb> $bind (<b>no<\u002Fb> x/y — see V6)<\u002Ftd><td><span class=\"tag event\">event: openSkill<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">\"Why X matters\" collapsible<\u002Ftd><td class=\"cmp\">Reveal › Markdown<\u002Ftd><td class=\"prop\"><b>summary<\u002Fb>, <b>open<\u002Fb> {\"$bind\":\"/lesson/why/open\"}, one child<\u002Ftd><td><span class=\"tag event\">event: toggleReveal<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Lesson stepper<\u002Ftd><td class=\"cmp\">Stepper › Step<\u002Ftd><td class=\"prop\"><b>current<\u002Fb> $bind; Step <b>title<\u002Fb>, <b>body<\u002Fb><\u002Ftd><td><span class=\"tag bind\">bound<\u002Fspan><\u002Ftd><\u002Ftr>\n\n              <tr class=\"grp-row\"><td colspan=\"4\">Prompt-craft<\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Before / after diff<\u002Ftd><td class=\"cmp\">PromptDiff<\u002Ftd><td class=\"prop\"><b>before<\u002Fb> $bind, <b>after<\u002Fb> $bind, <b>verdict<\u002Fb> $bind<\u002Ftd><td><span class=\"tag fn\">fn: highlightDiff<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Prompt editor<\u002Ftd><td class=\"cmp\">TextField<\u002Ftd><td class=\"prop\"><b>value<\u002Fb> (local), <b>multiline<\u002Fb><\u002Ftd><td><span class=\"tag bind\">local until Forge<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">\"Forge\" (re-run diff)<\u002Ftd><td class=\"cmp\">Button › Row[Icon,Text]<\u002Ftd><td class=\"prop\"><b>emphasis<\u002Fb>:\"primary\"<\u002Ftd><td><span class=\"tag event\">event: regeneratePrompt<\u002Fspan><\u002Ftd><\u002Ftr>\n              <tr><td class=\"el\">Code sample + copy<\u002Ftd><td class=\"cmp\">CodeBlock<\u002Ftd><td class=\"prop\"><b>language<\u002Fb>, <b>code<\u002Fb> $bind, <b>copyable<\u002Fb><\u002Ftd><td><span class=\"tag fn\">fn: copyToClipboard<\u002Fspan><\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n        <p style=\"margin-top:18px; color: var(--ink-subtle); font-size: 13.5px;\">Every interactive element resolves to\n          <b style=\"color:var(--ink-muted)\">event<\u002Fb> (server round-trip) or a <b style=\"color:var(--ink-muted)\">registered function<\u002Fb>.\n          There is no client <code class=\"inline\">close<\u002Fcode>, <code class=\"inline\">filter<\u002Fcode>,\n          <code class=\"inline\">sort<\u002Fcode>, or <code class=\"inline\">dismiss<\u002Fcode> anywhere — dismissal is\n          <code class=\"inline\">deleteSurface<\u002Fcode> only.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- ================= VIOLATIONS ================= -->\n      <section id=\"violations\">\n        <div class=\"sec-eyebrow\"><span class=\"num\">02<\u002Fspan> Violations found<\u002Fdiv>\n        <h2 class=\"sec\">Eleven places the mockup breaks a hard constraint<\u002Fh2>\n        <p class=\"sec-intro\">Each names the <b>rule<\u002Fb>, <b>what I drew<\u002Fb>, and the <b>fix<\u002Fb>, labelled\n          <span class=\"fix-label fix-a\">a · constrain to catalog<\u002Fspan>\n          <span class=\"fix-label fix-c\">c · server round-trip<\u002Fspan>\n          <span class=\"fix-label fix-b\">b · documented extension<\u002Fspan>. I default hard to (a) and (c);\n          (b) is used exactly once and justified.<\u002Fp>\n\n        <!-- V1 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">1<\u002Fspan><div><p class=\"viol-title\">Client-side answer grading &amp; auto-advance timer<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>Only two action shapes exist; the diagnostic loop (§6.2) round-trips through Jarvis. There is no registered <code class=\"inline\">grade<\u002Fcode> function, and inputs are local until an action fires — the agent decides what happens next.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd><code class=\"inline\">QuizCard<\u002Fcode> holds <code class=\"inline\">correctKey<\u002Fcode> and computes <code class=\"inline\">k === correctKey<\u002Fcode> locally, then a <code class=\"inline\">setTimeout(…, 1500)<\u002Fcode> advances to the next question. The client both grades and drives the loop.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-c\">c<\u002Fspan> The tap fires <code class=\"inline\">{event:{name:\"answerSelected\", args:{choice}}}<\u002Fcode>. Jarvis grades server-side, returns <code class=\"inline\">updateDataModel<\u002Fcode> (score, progress, per-choice state, feedback) then <code class=\"inline\">updateComponents<\u002Fcode> welding the next question in place. No <code class=\"inline\">correctKey<\u002Fcode> on the client, no client timer — the next question's arrival <em>is<\u002Fem> the advance. Full sequence in §04.<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V2 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">2<\u002Fspan><div><p class=\"viol-title\">\"Live\" values hardcoded as literals<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>Ring %, score, step index, skill values, reveal open-state and skillmap topology must be <b>data-bound to JSON-Pointer paths<\u002Fb>, not hardcoded.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd><code class=\"inline\">value={score/5}<\u002Fcode>, <code class=\"inline\">value={0.78}<\u002Fcode>, <code class=\"inline\">value={0.64}<\u002Fcode>, <code class=\"inline\">value={index/QUIZ.length}<\u002Fcode>, mastery floats inline in <code class=\"inline\">SKILL_NODES<\u002Fcode>. All literals living in client React state.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-a\">a<\u002Fspan> Replace every live literal with <code class=\"inline\">{\"$bind\":\"/diag/score\"}<\u002Fcode>-style pointers; the values arrive only via <code class=\"inline\">updateDataModel<\u002Fcode>. Component props reference the data model; the renderer subscribes to the pointer and animates on change.<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V3 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">3<\u002Fspan><div><p class=\"viol-title\">Ember used as a decorative ring / meter color<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd><span class=\"ember-ink\">--ember<\u002Fspan> is reserved for the <b>weld, the active step, and the primary CTA — never decorative<\u002Fb>.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd>The diagnostic <code class=\"inline\">ProgressRing tone=\"ember\"<\u002Fcode> and a results <code class=\"inline\">SkillMeter tone=\"ember\"<\u002Fcode>. Neither is a weld, an active step, or a CTA — this is ember as decoration.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-a\">a<\u002Fspan> An in-progress, semantically-neutral value is neither \"agent working\" nor \"success\", so it takes <b>--ink-muted<\u002Fb> fill on a <b>--hairline<\u002Fb> track. <code class=\"inline\">--success<\u002Fcode> only where it truly means good/passed. The diagnostic ring and the \"Surface lifecycle\" meter lose their ember.<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V4 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">4<\u002Fspan><div><p class=\"viol-title\">Invented <code style=\"font-size:.85em\">icon<\u002Fcode> + ambiguous <code style=\"font-size:.85em\">variant<\u002Fcode> on Button<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>Button = a single child + an action; <b>Button has no text/label prop<\u002Fb>, and each component may use only the properties listed in §4.2 — no invented props.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd><code class=\"inline\">&lt;Button variant=\"primary\" icon=\"flame\"&gt;Run a diagnostic&lt;/Button&gt;<\u002Fcode> — an <code class=\"inline\">icon<\u002Fcode> prop (not in §4.2) and a bare text child rather than a Text component.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-a\">a<\u002Fspan> Drop <code class=\"inline\">icon<\u002Fcode>. The single child becomes <code class=\"inline\">Row[Icon, Text]<\u002Fcode>. The label is a real <code class=\"inline\">Text<\u002Fcode>, never a prop. Primary emphasis stays expressible only because the ember-CTA rule sanctions it — it maps to the catalog's <code class=\"inline\">emphasis<\u002Fcode> enum (confirm exact name against §4.2; the renderer paints \"primary\" with <code class=\"inline\">primaryColor<\u002Fcode>/--ember, all others neutral).<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V5 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">5<\u002Fspan><div><p class=\"viol-title\">Layout built from styled <code style=\"font-size:.85em\">&lt;div&gt;<\u002Fcode>s<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>The agent emits <b>no CSS<\u002Fb>. Multi-child layout is expressed with <code class=\"inline\">Row<\u002Fcode>/<code class=\"inline\">Column<\u002Fcode> and their listed props only.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd><code class=\"inline\">&lt;div style={{display:\"flex\", gap:24, alignItems:\"center\", flexWrap:\"wrap\", minWidth:240, flex:1}}&gt;<\u002Fcode> throughout the results and diagnostic layouts — inline CSS the agent could never legally send.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-a\">a<\u002Fspan> Rebuild as <code class=\"inline\">Row<\u002Fcode>/<code class=\"inline\">Column<\u002Fcode> with <code class=\"inline\">gap<\u002Fcode>/<code class=\"inline\">align<\u002Fcode>/<code class=\"inline\">justify<\u002Fcode>/<code class=\"inline\">wrap<\u002Fcode>. Arbitrary px (<code class=\"inline\">minWidth:240<\u002Fcode>, <code class=\"inline\">flex:1<\u002Fcode>) are <b>renderer-owned responsive behavior<\u002Fb> — they vanish from the message; the renderer decides how a Row wraps at narrow widths.<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V6 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">6<\u002Fspan><div><p class=\"viol-title\">SkillMap nodes carry <code style=\"font-size:.85em\">x/y<\u002Fcode> layout coordinates<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>Geometry and layout are renderer-owned styling keyed off state — not properties in the A2UI message.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd><code class=\"inline\">{ label:\"Few-shot\", x:330, y:60, mastery:0.45 }<\u002Fcode> — the agent dictating pixel positions for the constellation.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-a\">a<\u002Fspan> The agent emits <b>topology only<\u002Fb>: nodes as <code class=\"inline\">{id, label, mastery, state}<\u002Fcode> and <code class=\"inline\">edges<\u002Fcode> as id pairs, both bound to the data model. The renderer computes the constellation layout (force/radial). Mastery still drives node size — a non-color cue — but the agent never sends coordinates.<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V7 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">7<\u002Fspan><div><p class=\"viol-title\">Reveal uses <code style=\"font-size:.85em\">defaultOpen<\u002Fcode>, not a bound <code style=\"font-size:.85em\">open<\u002Fcode><\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>Reveal = summary + single child + <b>bindable <code class=\"inline\">open<\u002Fcode><\u002Fb>, so the agent can open it as it teaches.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd><code class=\"inline\">&lt;Reveal defaultOpen&gt;<\u002Fcode> — a one-time literal the agent can't drive afterward.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-a\">a<\u002Fspan> <code class=\"inline\">open={\"$bind\":\"/lesson/why/open\"}<\u002Fcode>. The learner's toggle writes that pointer locally and may fire <code class=\"inline\">{event:{name:\"toggleReveal\"}}<\u002Fcode> so Jarvis can react or pre-open the next one.<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V8 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">8<\u002Fspan><div><p class=\"viol-title\">PromptDiff \"re-runs\" the improved prompt on the client<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>Registered functions are a fixed set (required, regex, email, formatString, formatCurrency, openUrl, and, or, not, copyToClipboard, <b>highlightDiff<\u002Fb>). <code class=\"inline\">highlightDiff<\u002Fcode> only renders the diff between two given strings — it can't <em>generate<\u002Fem> a better prompt.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd>\"Forge\" calls <code class=\"inline\">onForge<\u002Fcode> which re-runs a local diff against a pre-baked improved version (<code class=\"inline\">DIFF_AFTER<\u002Fcode>).<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-c\">c<\u002Fspan> \"Forge\" fires <code class=\"inline\">{event:{name:\"regeneratePrompt\", args:{draft}}}<\u002Fcode>. Jarvis returns <code class=\"inline\">updateDataModel<\u002Fcode> with the new <code class=\"inline\">after<\u002Fcode> string + verdict; the renderer then paints the colored diff via the local <code class=\"inline\">highlightDiff<\u002Fcode> function. Generation is the agent's; highlighting is local.<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V9 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">9<\u002Fspan><div><p class=\"viol-title\">Raw hex tints painted on elements<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>Color tokens only — <code class=\"inline\">--ember / --agent / --ink* / --surface-1·2 / --hairline<\u002Fcode> plus semantics. <b>No raw hex on elements.<\u002Fb><\u002Fdd>\n            <dt>I drew<\u002Fdt><dd><code class=\"inline\">.choice.correct{background:#0d1a10}<\u002Fcode>, <code class=\"inline\">.choice.wrong{background:#1a0d0e}<\u002Fcode>, diff <code class=\"inline\">#7ee0a0<\u002Fcode>/<code class=\"inline\">#f0a0a4<\u002Fcode>, codeblock <code class=\"inline\">#0a0b0c<\u002Fcode>, skeleton <code class=\"inline\">#16181a<\u002Fcode>. A dozen off-token hexes.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-a\">a<\u002Fspan> Derive every tint from a token: <code class=\"inline\">color-mix(in srgb, var(--surface-1), var(--success) 9%)<\u002Fcode> for the correct state, <code class=\"inline\">…var(--danger) 9%)<\u002Fcode> for wrong, etc. The renderer owns these mixes — but they resolve from the three theme tokens, never free hex.<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V10 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">10<\u002Fspan><div><p class=\"viol-title\">ProgressRing.size as an agent-set dimension<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>Sizing is renderer-owned styling; the agent emits no dimensions.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd><code class=\"inline\">&lt;ProgressRing size={72}/&gt;<\u002Fcode> and <code class=\"inline\">size={96}<\u002Fcode> — the agent prescribing pixels.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-a\">a<\u002Fspan> Drop <code class=\"inline\">size<\u002Fcode>. The renderer sizes the ring by context (a ring inside a header Row is compact; a hero results ring is large). If the catalog needs a knob, it's a semantic <code class=\"inline\">scale:\"sm\"|\"md\"|\"lg\"<\u002Fcode> enum — never raw px.<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <!-- V11 -->\n        <div class=\"viol\">\n          <div class=\"viol-head\"><span class=\"viol-num\">11<\u002Fspan><div><p class=\"viol-title\">SkillMeter's animated numeric <code style=\"font-size:.85em\">delta<\u002Fcode> badge<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <dl class=\"viol-grid\">\n            <dt>Rule<\u002Fdt><dd>Components may use only §4.2 properties; v1 is locked at 11 learn components (owner decision D3). Extensions require real justification.<\u002Fdd>\n            <dt>I drew<\u002Fdt><dd><code class=\"inline\">&lt;SkillMeter delta={18}/&gt;<\u002Fcode> rendering a \"+18\" badge — the <em>change<\u002Fem> since last session, animated alongside the bar.<\u002Fdd>\n            <dt>Fix<\u002Fdt><dd><span class=\"fix-label fix-b\">b — documented extension<\u002Fspan> This is the one place the existing vocabulary genuinely can't express the intent. The \"+18 since last week\" framing is core to \"the change is the feedback,\" and it can't be a separate <code class=\"inline\">Text<\u002Fcode> without losing the bar↔delta spatial coupling and the synchronized spring animation.\n              <div class=\"code\" style=\"margin-top:12px\">\n                <div class=\"code-bar\"><span class=\"lang\">extension request · SkillMeter<\u002Fspan><span class=\"seq\">D3 review<\u002Fspan><\u002Fdiv>\n<pre><span class=\"c\">// add ONE optional bound property to the existing SkillMeter — not a new component<\u002Fspan>\n<span class=\"k\">SkillMeter<\u002Fspan>.props.<span class=\"b\">delta<\u002Fspan>: {\n  type: <span class=\"s\">\"number | DataBinding\"<\u002Fspan>,   <span class=\"c\">// signed change vs. baseline; null = hide badge<\u002Fspan>\n  optional: <span class=\"k\">true<\u002Fspan>\n}\n<span class=\"c\">// Why not existing parts: a sibling Text can show \"+18\" but the renderer can't<\u002Fspan>\n<span class=\"c\">// couple its spring to the bar's, and the agent would have to emit layout to<\u002Fspan>\n<span class=\"c\">// place it. delta keeps it one component, one animation, zero CSS.<\u002Fspan><\u002Fpre>\n              <\u002Fdiv>\n              <b>Fallback if D3 says no:<\u002Fb> demote to plain text inside the meter's label slot, accepting the lost animation coupling — i.e. fall back to (a).<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <h3 class=\"sub\">Things I checked that <span class=\"pass\">pass<\u002Fspan><\u002Fh3>\n        <ul class=\"clean\">\n          <li class=\"ok\"><b>No illegal components.<\u002Fb> Zero Accordion / Table / Badge / Alert / Dropdown / Tooltip / Toast / Chart / Nav / Breadcrumb / Date picker. Collapsible is <code class=\"inline\">Reveal<\u002Fcode>; tabs were never used.<\u002Fli>\n          <li class=\"ok\"><b>Card wraps exactly one child<\u002Fb> — the surface block is Card › Column, never Card with N children.<\u002Fli>\n          <li class=\"ok\"><b>Jarvis is in-surface.<\u002Fb> Voice = <code class=\"inline\">CoachNote<\u002Fcode>; presence = a breathing dot + shimmer keyed off stream state. No corner chat bubble, no fixed sidebar.<\u002Fli>\n          <li class=\"ok\"><b>Authorization (D1) holds.<\u002Fb> Every restructure is reactive to a learner action; the feedback CoachNote <em>replaces<\u002Fem> rather than stacks; no unsolicited idle nudge appears, and none would stack.<\u002Fli>\n          <li class=\"ok\"><b>Inputs are local until an action fires.<\u002Fb> The PromptDiff textarea and quiz selection don't round-trip per keystroke — only the explicit Forge / answer action does.<\u002Fli>\n          <li class=\"ok\"><b>Dismissal is <code class=\"inline\">deleteSurface<\u002Fcode> only<\u002Fb> — there is no client close/filter/sort anywhere in the mockup.<\u002Fli>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <!-- ================= WELD + STREAMING ================= -->\n      <section id=\"weld\">\n        <div class=\"sec-eyebrow\"><span class=\"num\">03<\u002Fspan> The Weld &amp; streaming, in protocol<\u002Fdiv>\n        <h2 class=\"sec\">The exact message sequence behind each animated moment<\u002Fh2>\n        <p class=\"sec-intro\">The crucial claim: <b>the Weld and the shimmer are never in the A2UI message.<\u002Fb>\n          They are renderer animations keyed off protocol <em>state transitions<\u002Fem>. The agent emits data\n          and components; the renderer reacts. Here is what a renderer engineer reproduces.<\u002Fp>\n\n        <h3 class=\"sub\">Streaming → Weld, for a brand-new surface (\"Run a diagnostic\")<\u002Fh3>\n        <ol class=\"step-flow\">\n          <li class=\"stream\"><div class=\"flow-t\">Learner action arrives<\u002Fdiv><div class=\"flow-d\">The CTA fired <code class=\"inline\">{event:{name:\"runDiagnostic\"}}<\u002Fcode>. The renderer marks Jarvis <b>streaming<\u002Fb> and paints the shimmer (1px <span class=\"agent-ink\">--agent<\u002Fspan> gradient sweeping the top hairline) + skeleton rows. <span class=\"owner\">owner: renderer · trigger: outbound event, awaiting response<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li class=\"stream\"><div class=\"flow-t\"><code class=\"inline\">createSurface<\u002Fcode><\u002Fdiv><div class=\"flow-d\">Jarvis opens the surface and seeds the data model. No components yet; shimmer continues.\n            <div class=\"code\"><div class=\"code-bar\"><span class=\"lang\">A2UI message<\u002Fspan><span class=\"seq\">1 · createSurface<\u002Fspan><\u002Fdiv>\n<pre>{ <span class=\"k\">\"createSurface\"<\u002Fspan>: {\n    <span class=\"k\">\"surfaceId\"<\u002Fspan>: <span class=\"s\">\"diag-1\"<\u002Fspan>,\n    <span class=\"k\">\"root\"<\u002Fspan>: <span class=\"s\">\"root\"<\u002Fspan>,\n    <span class=\"k\">\"dataModel\"<\u002Fspan>: {\n      <span class=\"k\">\"diag\"<\u002Fspan>: { <span class=\"k\">\"index\"<\u002Fspan>: <span class=\"n\">0<\u002Fspan>, <span class=\"k\">\"total\"<\u002Fspan>: <span class=\"n\">5<\u002Fspan>, <span class=\"k\">\"score\"<\u002Fspan>: <span class=\"n\">0<\u002Fspan>,\n                <span class=\"k\">\"progress\"<\u002Fspan>: <span class=\"n\">0<\u002Fspan>, <span class=\"k\">\"correctLabel\"<\u002Fspan>: <span class=\"s\">\"0 correct so far\"<\u002Fspan>,\n                <span class=\"k\">\"q\"<\u002Fspan>: { <span class=\"c\">/* first question, see below */<\u002Fspan> },\n                <span class=\"k\">\"choiceState\"<\u002Fspan>: <span class=\"k\">null<\u002Fspan>, <span class=\"k\">\"feedback\"<\u002Fspan>: <span class=\"k\">null<\u002Fspan> }\n    }\n} }<\u002Fpre><\u002Fdiv><\u002Fdiv><\u002Fli>\n          <li class=\"weld\"><div class=\"flow-t\"><code class=\"inline\">updateComponents<\u002Fcode> — the flat array lands<\u002Fdiv><div class=\"flow-d\">A flat adjacency list; the renderer assembles the tree from <code class=\"inline\">id:\"root\"<\u002Fcode> down. The instant the first component mounts, the shimmer stops and the <b>Weld<\u002Fb> fires: the block's hairline lights <span class=\"ember-ink\">--ember-hot<\u002Fspan>, children stagger in (scale 0.98→1, 8px rise), and the ember cools to <code class=\"inline\">--hairline<\u002Fcode> over 1.2s.\n            <div class=\"code\"><div class=\"code-bar\"><span class=\"lang\">A2UI message<\u002Fspan><span class=\"seq\">2 · updateComponents<\u002Fspan><\u002Fdiv>\n<pre>{ <span class=\"k\">\"updateComponents\"<\u002Fspan>: {\n  <span class=\"k\">\"surfaceId\"<\u002Fspan>: <span class=\"s\">\"diag-1\"<\u002Fspan>,\n  <span class=\"k\">\"components\"<\u002Fspan>: [\n    { <span class=\"k\">\"id\"<\u002Fspan>:<span class=\"s\">\"root\"<\u002Fspan>, <span class=\"k\">\"type\"<\u002Fspan>:<span class=\"k\">\"Card\"<\u002Fspan>, <span class=\"k\">\"children\"<\u002Fspan>:[<span class=\"s\">\"col\"<\u002Fspan>] },\n    { <span class=\"k\">\"id\"<\u002Fspan>:<span class=\"s\">\"col\"<\u002Fspan>, <span class=\"k\">\"type\"<\u002Fspan>:<span class=\"k\">\"Column\"<\u002Fspan>, <span class=\"k\">\"props\"<\u002Fspan>:{<span class=\"k\">\"gap\"<\u002Fspan>:<span class=\"n\">18<\u002Fspan>},\n      <span class=\"k\">\"children\"<\u002Fspan>:[<span class=\"s\">\"eyebrow\"<\u002Fspan>,<span class=\"s\">\"hdr\"<\u002Fspan>,<span class=\"s\">\"rule\"<\u002Fspan>,<span class=\"s\">\"q\"<\u002Fspan>] },\n    { <span class=\"k\">\"id\"<\u002Fspan>:<span class=\"s\">\"eyebrow\"<\u002Fspan>, <span class=\"k\">\"type\"<\u002Fspan>:<span class=\"k\">\"Text\"<\u002Fspan>,\n      <span class=\"k\">\"props\"<\u002Fspan>:{<span class=\"k\">\"text\"<\u002Fspan>:<span class=\"s\">\"DIAGNOSTIC · 5 QUESTIONS\"<\u002Fspan>,<span class=\"k\">\"style\"<\u002Fspan>:<span class=\"s\">\"eyebrow\"<\u002Fspan>} },\n    { <span class=\"k\">\"id\"<\u002Fspan>:<span class=\"s\">\"hdr\"<\u002Fspan>, <span class=\"k\">\"type\"<\u002Fspan>:<span class=\"k\">\"Row\"<\u002Fspan>, <span class=\"k\">\"props\"<\u002Fspan>:{<span class=\"k\">\"gap\"<\u002Fspan>:<span class=\"n\">18<\u002Fspan>,<span class=\"k\">\"align\"<\u002Fspan>:<span class=\"s\">\"center\"<\u002Fspan>},\n      <span class=\"k\">\"children\"<\u002Fspan>:[<span class=\"s\">\"ring\"<\u002Fspan>,<span class=\"s\">\"count\"<\u002Fspan>] },\n    { <span class=\"k\">\"id\"<\u002Fspan>:<span class=\"s\">\"ring\"<\u002Fspan>, <span class=\"k\">\"type\"<\u002Fspan>:<span class=\"k\">\"ProgressRing\"<\u002Fspan>, <span class=\"k\">\"props\"<\u002Fspan>:{\n        <span class=\"k\">\"value\"<\u002Fspan>:{<span class=\"b\">\"$bind\"<\u002Fspan>:<span class=\"b\">\"/diag/progress\"<\u002Fspan>},\n        <span class=\"k\">\"label\"<\u002Fspan>:{<span class=\"b\">\"$bind\"<\u002Fspan>:<span class=\"b\">\"/diag/index\"<\u002Fspan>}, <span class=\"k\">\"tone\"<\u002Fspan>:<span class=\"s\">\"neutral\"<\u002Fspan>} },\n    { <span class=\"k\">\"id\"<\u002Fspan>:<span class=\"s\">\"count\"<\u002Fspan>, <span class=\"k\">\"type\"<\u002Fspan>:<span class=\"k\">\"Text\"<\u002Fspan>, <span class=\"k\">\"props\"<\u002Fspan>:{\n        <span class=\"k\">\"text\"<\u002Fspan>:{<span class=\"b\">\"$bind\"<\u002Fspan>:<span class=\"b\">\"/diag/correctLabel\"<\u002Fspan>},<span class=\"k\">\"style\"<\u002Fspan>:<span class=\"s\">\"caption\"<\u002Fspan>} },\n    { <span class=\"k\">\"id\"<\u002Fspan>:<span class=\"s\">\"rule\"<\u002Fspan>, <span class=\"k\">\"type\"<\u002Fspan>:<span class=\"k\">\"Divider\"<\u002Fspan> },\n    { <span class=\"k\">\"id\"<\u002Fspan>:<span class=\"s\">\"q\"<\u002Fspan>, <span class=\"k\">\"type\"<\u002Fspan>:<span class=\"k\">\"QuizCard\"<\u002Fspan>, <span class=\"k\">\"props\"<\u002Fspan>:{\n        <span class=\"k\">\"prompt\"<\u002Fspan>:{<span class=\"b\">\"$bind\"<\u002Fspan>:<span class=\"b\">\"/diag/q/prompt\"<\u002Fspan>},\n        <span class=\"k\">\"choices\"<\u002Fspan>:{<span class=\"b\">\"$bind\"<\u002Fspan>:<span class=\"b\">\"/diag/q/choices\"<\u002Fspan>},\n        <span class=\"k\">\"state\"<\u002Fspan>:{<span class=\"b\">\"$bind\"<\u002Fspan>:<span class=\"b\">\"/diag/choiceState\"<\u002Fspan>},\n        <span class=\"k\">\"onAnswer\"<\u002Fspan>:{<span class=\"k\">\"event\"<\u002Fspan>:{<span class=\"k\">\"name\"<\u002Fspan>:<span class=\"s\">\"answerSelected\"<\u002Fspan>,<span class=\"k\">\"surfaceId\"<\u002Fspan>:<span class=\"s\">\"diag-1\"<\u002Fspan>}} } }\n  ]\n} }<\u002Fpre><\u002Fdiv>\n            <span class=\"owner\">owner: renderer animation · trigger: components-mounted transition · the message contains <b>no<\u002Fb> weld/shimmer property<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li><div class=\"flow-t\">Idle<\u002Fdiv><div class=\"flow-d\">Ember has cooled; presence dot returns to the slow breathing idle. The surface now waits on the learner — state lives entirely in <code class=\"inline\">/diag<\u002Fcode>.<\u002Fdiv><\u002Fli>\n        <\u002Fol>\n\n        <div class=\"callout\"><b>Why this is reproducible:<\u002Fb> the renderer owns a 3-state machine per surface —\n          <span class=\"agent-ink\">streaming<\u002Fspan> (awaiting a response) → <span class=\"ember-ink\">welding<\u002Fspan>\n          (components just landed, 1.2s) → idle. Grain, ember bloom, glass, shimmer and weld all key off that\n          machine. The A2UI message never carries motion; swap the renderer's CSS and the same message stream\n          renders calm or kinetic.<\u002Fdiv>\n\n        <div class=\"callout agent\"><b>The one moment that is <em>not<\u002Fem> a clean message sequence — and the fix.<\u002Fb>\n          The drifting <b>ember bloom<\u002Fb> that re-anchors to \"where the most recent surface was forged\" needs the\n          render position of the new block. That position isn't in any message (layout is renderer-owned, correctly).\n          So the bloom must be driven by the renderer's own post-layout measurement of the welded block — <b>not<\u002Fb>\n          by an agent-supplied coordinate (which would repeat violation V6). Flagged: it's renderer-internal, never protocol.<\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ================= DIAGNOSTIC LOOP ================= -->\n      <section id=\"loop\">\n        <div class=\"sec-eyebrow\"><span class=\"num\">04<\u002Fspan> The diagnostic loop (§6.2)<\u002Fdiv>\n        <h2 class=\"sec\">Answer → event → tick → weld-in-place, with no re-render<\u002Fh2>\n        <p class=\"sec-intro\">This is the heart of \"live, not lazy.\" The learner answers question 2 of 5. Watch\n          that <b>nothing re-renders<\u002Fb> and <b>no page transitions<\u002Fb> — the data model ticks, one component\n          id is replaced, and the ring fills.<\u002Fp>\n\n        <ol class=\"step-flow\">\n          <li><div class=\"flow-t\">Learner taps choice \"b\" (local, no round-trip yet)<\u002Fdiv><div class=\"flow-d\">Selection is local UI state inside QuizCard. The component does <b>not<\u002Fb> grade — it has no <code class=\"inline\">correctKey<\u002Fcode>. On commit it fires the one action:\n            <div class=\"code\"><div class=\"code-bar\"><span class=\"lang\">outbound action<\u002Fspan><span class=\"seq\">event<\u002Fspan><\u002Fdiv>\n<pre>{ <span class=\"k\">\"action\"<\u002Fspan>: { <span class=\"k\">\"event\"<\u002Fspan>: {\n    <span class=\"k\">\"name\"<\u002Fspan>: <span class=\"s\">\"answerSelected\"<\u002Fspan>,\n    <span class=\"k\">\"surfaceId\"<\u002Fspan>: <span class=\"s\">\"diag-1\"<\u002Fspan>,\n    <span class=\"k\">\"args\"<\u002Fspan>: { <span class=\"k\">\"choice\"<\u002Fspan>: <span class=\"s\">\"b\"<\u002Fspan>, <span class=\"k\">\"index\"<\u002Fspan>: <span class=\"n\">1<\u002Fspan> }\n} } }<\u002Fpre><\u002Fdiv><\u002Fdiv><\u002Fli>\n\n          <li class=\"stream\"><div class=\"flow-t\">Jarvis grades server-side &amp; ticks the data model<\u002Fdiv><div class=\"flow-d\">The agent decides correctness, then patches pointers. Bound components (ring, score label, the answered QuizCard's per-choice state, the feedback CoachNote) re-render <b>from the binding<\u002Fb> — a targeted update, not a tree rebuild.\n            <div class=\"code\"><div class=\"code-bar\"><span class=\"lang\">A2UI message<\u002Fspan><span class=\"seq\">1 · updateDataModel<\u002Fspan><\u002Fdiv>\n<pre>{ <span class=\"k\">\"updateDataModel\"<\u002Fspan>: {\n  <span class=\"k\">\"surfaceId\"<\u002Fspan>: <span class=\"s\">\"diag-1\"<\u002Fspan>,\n  <span class=\"k\">\"patches\"<\u002Fspan>: [\n    { <span class=\"k\">\"path\"<\u002Fspan>: <span class=\"b\">\"/diag/choiceState\"<\u002Fspan>,\n      <span class=\"k\">\"value\"<\u002Fspan>: { <span class=\"k\">\"b\"<\u002Fspan>:<span class=\"s\">\"correct\"<\u002Fspan> } },        <span class=\"c\">// drives the ✓ icon + tint<\u002Fspan>\n    { <span class=\"k\">\"path\"<\u002Fspan>: <span class=\"b\">\"/diag/score\"<\u002Fspan>,    <span class=\"k\">\"value\"<\u002Fspan>: <span class=\"n\">2<\u002Fspan> },\n    { <span class=\"k\">\"path\"<\u002Fspan>: <span class=\"b\">\"/diag/index\"<\u002Fspan>,    <span class=\"k\">\"value\"<\u002Fspan>: <span class=\"n\">2<\u002Fspan> },\n    { <span class=\"k\">\"path\"<\u002Fspan>: <span class=\"b\">\"/diag/progress\"<\u002Fspan>, <span class=\"k\">\"value\"<\u002Fspan>: <span class=\"n\">0.4<\u002Fspan> },   <span class=\"c\">// ring springs 0.2 → 0.4<\u002Fspan>\n    { <span class=\"k\">\"path\"<\u002Fspan>: <span class=\"b\">\"/diag/correctLabel\"<\u002Fspan>, <span class=\"k\">\"value\"<\u002Fspan>: <span class=\"s\">\"2 correct so far\"<\u002Fspan> },\n    { <span class=\"k\">\"path\"<\u002Fspan>: <span class=\"b\">\"/diag/feedback\"<\u002Fspan>,\n      <span class=\"k\">\"value\"<\u002Fspan>: { <span class=\"k\">\"tone\"<\u002Fspan>:<span class=\"s\">\"praise\"<\u002Fspan>,\n                <span class=\"k\">\"text\"<\u002Fspan>:<span class=\"s\">\"Exactly — the data model ticks, bound components re-render. No reload.\"<\u002Fspan> } }\n  ]\n} }<\u002Fpre><\u002Fdiv>\n            <span class=\"owner\">no components in this message → the renderer cannot re-render the tree, only the bound leaves<\u002Fspan><\u002Fdiv><\u002Fli>\n\n          <li class=\"weld\"><div class=\"flow-t\">Jarvis welds the next question into the <em>same<\u002Fem> slot<\u002Fdiv><div class=\"flow-d\">A second message replaces <b>only<\u002Fb> component <code class=\"inline\">id:\"q\"<\u002Fcode>. Same id, new props ⇒ the renderer re-welds that node in place (ember hairline on the QuizCard, stagger), while root/column/ring/header are untouched. This is the \"next question welds in where the last one was\" moment — no page transition because there is no navigation, just a swapped sub-tree.\n            <div class=\"code\"><div class=\"code-bar\"><span class=\"lang\">A2UI message<\u002Fspan><span class=\"seq\">2 · updateComponents (single id)<\u002Fspan><\u002Fdiv>\n<pre>{ <span class=\"k\">\"updateComponents\"<\u002Fspan>: {\n  <span class=\"k\">\"surfaceId\"<\u002Fspan>: <span class=\"s\">\"diag-1\"<\u002Fspan>,\n  <span class=\"k\">\"components\"<\u002Fspan>: [\n    { <span class=\"k\">\"id\"<\u002Fspan>:<span class=\"s\">\"q\"<\u002Fspan>, <span class=\"k\">\"type\"<\u002Fspan>:<span class=\"k\">\"QuizCard\"<\u002Fspan>, <span class=\"k\">\"props\"<\u002Fspan>:{\n        <span class=\"k\">\"prompt\"<\u002Fspan>:{<span class=\"b\">\"$bind\"<\u002Fspan>:<span class=\"b\">\"/diag/q/prompt\"<\u002Fspan>},     <span class=\"c\">// /diag/q already patched above<\u002Fspan>\n        <span class=\"k\">\"choices\"<\u002Fspan>:{<span class=\"b\">\"$bind\"<\u002Fspan>:<span class=\"b\">\"/diag/q/choices\"<\u002Fspan>},\n        <span class=\"k\">\"state\"<\u002Fspan>:{<span class=\"b\">\"$bind\"<\u002Fspan>:<span class=\"b\">\"/diag/choiceState\"<\u002Fspan>},   <span class=\"c\">// reset to null for the fresh Q<\u002Fspan>\n        <span class=\"k\">\"onAnswer\"<\u002Fspan>:{<span class=\"k\">\"event\"<\u002Fspan>:{<span class=\"k\">\"name\"<\u002Fspan>:<span class=\"s\">\"answerSelected\"<\u002Fspan>,<span class=\"k\">\"surfaceId\"<\u002Fspan>:<span class=\"s\">\"diag-1\"<\u002Fspan>}} } }\n  ]\n} }<\u002Fpre><\u002Fdiv><\u002Fdiv><\u002Fli>\n\n          <li><div class=\"flow-t\">Loop, then results<\u002Fdiv><div class=\"flow-d\">Repeat for each question. On the 5th answer, instead of replacing <code class=\"inline\">id:\"q\"<\u002Fcode>, Jarvis swaps the question region for the results layout (score ring + SkillMeters + CoachNote) via one more <code class=\"inline\">updateComponents<\u002Fcode> on the same surface — still no reload. Only a brand-new <em>moment<\u002Fem> (the Skill Map) warrants <code class=\"inline\">deleteSurface diag-1<\u002Fcode> + <code class=\"inline\">createSurface map-1<\u002Fcode>.<\u002Fdiv><\u002Fli>\n        <\u002Fol>\n\n        <div class=\"callout\"><b>Confirmed:<\u002Fb> across the entire 5-question diagnostic there is <b>one<\u002Fb> surface\n          (<code class=\"inline\">diag-1<\u002Fcode>), <b>zero<\u002Fb> full re-renders (every tick is an\n          <code class=\"inline\">updateDataModel<\u002Fcode> patch to a bound leaf), and <b>zero<\u002Fb> page transitions\n          (the next question is a single-id <code class=\"inline\">updateComponents<\u002Fcode>, not navigation). The\n          client never grades and never advances on a timer — Jarvis stays in the loop the whole way.<\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ================= A11Y ================= -->\n      <section id=\"a11y\">\n        <div class=\"sec-eyebrow\"><span class=\"num\">05<\u002Fspan> A11y &amp; theming pass<\u002Fdiv>\n        <h2 class=\"sec\">Contrast, non-color cues, reduced-motion, and the 3-token ceiling<\u002Fh2>\n        <p class=\"sec-intro\">Ratios below are computed against the actual tokens over the surfaces text\n          sits on. AA needs <b>4.5:1<\u002Fb> for normal text, <b>3:1<\u002Fb> for large/bold text and UI component\n          boundaries.<\u002Fp>\n\n        <h3 class=\"sub\">Ink contrast<\u002Fh3>\n        <table class=\"a11y\">\n          <thead><tr><th>Foreground<\u002Fth><th>Over<\u002Fth><th>Ratio<\u002Fth><th>Normal AA<\u002Fth><th>Verdict<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td><span class=\"swatch\" style=\"background:#f7f8f8\"><\u002Fspan>--ink #f7f8f8<\u002Ftd><td>--s
